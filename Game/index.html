<!DOCTYPE html>
<html>

    <head>
        <title>Game</title>
        <link rel = "stylesheet" href = "src/style.css">
    </head>

    <body>
        <div id = "game-ui">
            <div id = "fps">FPS</div>
            <div id = "top-bar">
                <button class = "edit-button" id = "run-game" type = "button">Fast >> </button>
                <button class = "edit-button" id = "restart-game" type = "button">Restart</button>
                <div class = "stat-pad" id = "lives">Lives</div>
                <div class = "stat-pad" id = "money">Money</div>
                <div class = "stat-pad" id = "round">Round</div>
            </div>
            <table id = "tower-menu">
                <tr><td><button class = "tower-button" id = "unit-tower">Unit</li></td></tr>
                <!-- <tr><td><button class = "tower-button" id = "electric-tower">Electric</li></td></tr>
                <tr><td><button class = "tower-button" id = "farm-tower">Farm</li></td></tr>
                <tr><td><button class = "tower-button" id = "rocket-tower">Rocket</li></td></tr> -->
              </table>

            <div id = "game-over-screen">
                <div id = "game-over-text">Game Over</div>
            </div>
        </div>
        <canvas id = "game-canvas"></canvas>
        <script type="module" src = "src/main.js"></script>
    </body>
</html>
